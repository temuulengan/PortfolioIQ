name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 55 / React Native 0.83 require Node 20+
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Catches unresolved imports and syntax errors that unit tests never touch
      - name: Verify the app bundles
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          FIREBASE_API_KEY: ci-placeholder
          FIREBASE_AUTH_DOMAIN: ci-placeholder
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_STORAGE_BUCKET: ci-placeholder
          FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          FIREBASE_APP_ID: ci-placeholder
